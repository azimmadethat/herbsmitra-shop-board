<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop Board · Loading...</title>
<script>
(function() {
  const DESIGNS = ["apple", "meta", "herbsmitra", "classic", "studio", "garden", "swiss", "night"];
  const params = new URLSearchParams(location.search);
  const q = params.get("design");
  const m = (document.cookie || "").match(/(?:^|;\s*)design=([a-z]+)/);
  const pick = [q, "classic", m && m[1]].find(d => DESIGNS.includes(d)) || "classic";
  location.replace("/" + pick + ".html" + location.search);
})();
</script>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
    background: #f5f5f7;
    color: #1d1d1f;
  }
  .loader {
    text-align: center;
  }
  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid rgba(0,113,227,.2);
    border-top-color: #0071e3;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="loader">
  <div class="spinner"></div>
  <div>Loading Shop Board…</div>
</div>
</body>
</html>
