<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Shop Board · Garden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Painted by hand: paper, watercolour, a pencil note or two, and a meadow that grows one flower per order. */
:root { --paper: #f5eedf; --ink: #2f2a24; --dim: #7b7062; --sage: #6f8f6a; --terra: #c4673f; --ochre: #d9a441; --rose: #d9798a; --sky: #7fa3c2; --plum: #8a6a9c; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body { background: var(--paper); color: var(--ink); font-family: "Fraunces", Georgia, serif; }
.paper { position: fixed; inset: 0; background:
  url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .3  0 0 0 0 .22  0 0 0 .09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
  var(--paper); }
.wash { position: fixed; border-radius: 50%; filter: blur(50px); opacity: .5; }
.w1 { width: 900px; height: 600px; left: -200px; top: -220px; background: #f2c9a8; }
.w2 { width: 800px; height: 700px; right: -260px; top: -140px; background: #c9dbe6; animation: breathe 18s ease-in-out infinite alternate; }
.w3 { width: 700px; height: 500px; left: 520px; top: 260px; background: #efe1b5; opacity: .45; }
@keyframes breathe { to { transform: translate(-40px, 30px) scale(1.06); } }

#stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform: translate(-50%,-50%); }
.hand { font-family: "Caveat", cursive; }

header { position: absolute; left: 100px; right: 100px; top: 54px; display: flex; justify-content: space-between; align-items: baseline; }
#clock { font-family: "Caveat"; font-size: 40px; color: var(--dim); }
#clock b { color: var(--ink); font-weight: 700; }
#headline { font-style: italic; font-size: 30px; color: var(--dim); max-width: 900px; text-align: center; }
#livetxt { font-family: "Caveat"; font-size: 34px; color: var(--sage); }
#livetxt::before { content: "● "; font-size: 22px; vertical-align: 4px; }

.left { position: absolute; left: 110px; top: 150px; width: 1040px; }
.so-far { font-family: "Caveat"; font-size: 54px; color: var(--terra); transform: rotate(-3deg); display: inline-block; margin-left: 6px; }
#rev { font-size: 230px; font-weight: 500; letter-spacing: -6px; line-height: .95; font-variation-settings: "opsz" 144; }
#rev .rs { font-size: 130px; color: var(--terra); font-weight: 400; margin-right: 8px; letter-spacing: 0; }
#rev.bump { animation: ink 1s ease; }
@keyframes ink { 30% { color: var(--terra); } }
.under { width: 640px; height: 26px; margin: 2px 0 0 10px; }
#prose { font-size: 40px; line-height: 1.35; margin-top: 16px; max-width: 980px; }
#prose em { font-style: italic; color: var(--terra); }
#prose .up { color: var(--sage); } #prose .down { color: var(--terra); }

#bubble { display: flex; gap: 16px; align-items: flex-start; margin-top: 34px; max-width: 1000px; }
#emo { font-size: 46px; line-height: 1.1; }
#itext { font-family: "Caveat"; font-size: 54px; line-height: 1.05; color: #3d4f3a; transition: opacity .4s, transform .4s; }
#itext.out { opacity: 0; transform: translateY(8px); }
#itext .q { display: block; font-family: "Fraunces"; font-style: italic; font-size: 26px; color: var(--dim); margin-bottom: 4px; }
#bubble.answer #itext { font-size: 42px; }

/* the ads, on a taped card */
.card { position: absolute; right: 100px; top: 130px; width: 600px; padding: 44px 44px 30px; background: #fffaf0; transform: rotate(1.4deg);
  box-shadow: 0 1px 0 rgba(0,0,0,.05), 0 18px 40px -18px rgba(60,40,10,.35); }
.card::before { content: ""; position: absolute; top: -20px; left: 50%; width: 170px; height: 44px; margin-left: -85px; transform: rotate(-3deg);
  background: repeating-linear-gradient(45deg, rgba(217,164,65,.55) 0 12px, rgba(217,164,65,.4) 12px 24px); }
.card .k { font-family: "Caveat"; font-size: 40px; color: var(--dim); }
#roas { font-size: 104px; font-weight: 500; line-height: 1; letter-spacing: -3px; margin-top: 4px; }
#roas small { font-size: 56px; color: var(--dim); font-weight: 400; letter-spacing: 0; }
#roasline { font-size: 28px; line-height: 1.35; margin-top: 8px; }
#roasline em { color: var(--terra); }
#roasnote { font-family: "Caveat"; font-size: 30px; color: var(--dim); margin-top: 6px; }
.rule { border: 0; border-top: 1.5px dashed rgba(47,42,36,.25); margin: 16px 0 12px; }
#camps { display: flex; flex-direction: column; gap: 12px; }
.cp { display: grid; grid-template-columns: 22px 1fr auto; gap: 14px; align-items: center; font-size: 25px; }
.cp i { width: 20px; height: 20px; border-radius: 50% 45% 55% 48%; opacity: .85; }
.cp .n { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cp .v { font-family: "Caveat"; font-size: 34px; font-weight: 700; }
.spent { font-family: "Caveat"; font-size: 30px; color: var(--dim); margin-top: 16px; }
.spent b { color: var(--ink); }

#chips { display: flex; flex-direction: column; gap: 0; margin-top: 12px; padding-top: 12px; border-top: 1.5px dashed rgba(47,42,36,.25); }
.chip { font-family: "Caveat"; font-size: 29px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; animation: write .8s; }
.chip b { color: var(--ink); font-weight: 700; }
@keyframes write { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }

/* meadow */
#meadow { position: absolute; left: 0; bottom: 0; width: 1920px; height: 300px; overflow: visible; }
.fl { transform-box: fill-box; transform-origin: 50% 100%; }
.fl.grow { animation: grow 1.6s cubic-bezier(.2,1.2,.4,1) both; }
@keyframes grow { from { transform: scaleY(0); } }
.fl .head { transform-box: fill-box; transform-origin: center; animation: sway 6s ease-in-out infinite alternate; }
@keyframes sway { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
.caption { position: absolute; left: 110px; bottom: 26px; font-family: "Caveat"; font-size: 32px; color: #fff; text-shadow: 0 1px 6px rgba(40,60,30,.5); }

#mic { position: absolute; right: 100px; bottom: 36px; border: 0; background: #fffaf0; border-radius: 40px; padding: 12px 26px 10px 18px; font-family: "Caveat"; font-size: 32px; color: var(--ink);
  box-shadow: 0 10px 24px -10px rgba(40,30,10,.4); display: flex; gap: 10px; align-items: center; cursor: pointer; }
#mic i { font-style: normal; font-size: 26px; }
#mic.listening { background: #f6d6c7; }

#toast { position: absolute; left: 50%; top: 380px; z-index: 50; width: 900px; margin-left: -450px; text-align: center; padding: 46px 40px 40px;
  background: #fffaf0; box-shadow: 0 30px 70px -20px rgba(60,40,10,.45); transform: translateY(30px) rotate(-1deg); opacity: 0; transition: opacity .6s, transform .7s cubic-bezier(.2,1.2,.4,1); }
#toast.show { opacity: 1; transform: rotate(-1deg); }
#toast::before { content: ""; position: absolute; inset: -60px; z-index: -1; border-radius: 50%; background: radial-gradient(closest-side, rgba(217,121,138,.35), transparent); filter: blur(20px); }
#tbig { font-size: 60px; }
#th { font-family: "Caveat"; font-size: 54px; color: var(--terra); }
#tamt { display: block; font-size: 130px; font-weight: 500; letter-spacing: -3px; line-height: 1; }
#tp { font-size: 30px; font-style: italic; color: var(--dim); margin-top: 10px; }

#milestone { position: absolute; inset: 0; z-index: 55; display: grid; place-items: center; background: rgba(245,238,223,.9); opacity: 0; pointer-events: none; transition: opacity .6s; text-align: center; }
#milestone.show { opacity: 1; }
#milestone p { font-family: "Caveat"; font-size: 70px; color: var(--terra); }
#milestone h2 { font-size: 240px; font-weight: 500; letter-spacing: -8px; line-height: 1; }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 60; }
#unlock { position: fixed; inset: 0; z-index: 100; display: none; place-items: center; background: rgba(245,238,223,.85); font-family: "Caveat"; font-size: 54px; text-align: center; cursor: pointer; }
#unlock.show { display: grid; }
#unlock small { display: block; font-family: "Fraunces"; font-size: 22px; color: var(--dim); }
</style>
</head>
<body>
<div class="paper"></div><div class="wash w1"></div><div class="wash w2"></div><div class="wash w3"></div>
<div id="stage">
  <header><div id="clock"></div><div id="headline"></div><div id="livetxt">live</div></header>

  <section class="left">
    <div class="so-far">today, so far</div>
    <div id="rev"><span class="rs">₹</span><span id="revnum">0</span></div>
    <svg class="under" viewBox="0 0 640 26"><path d="M4 16 C 120 4, 260 22, 380 12 S 560 6, 636 14" stroke="#c4673f" stroke-width="5" fill="none" stroke-linecap="round" opacity=".7"/></svg>
    <div id="prose"></div>
    <div id="bubble"><span id="emo">🌿</span><span id="itext">Opening the shutters…</span></div>
  </section>

  <div class="card">
    <div class="k">the ads</div>
    <div id="roas">-</div>
    <div id="roasline"></div>
    <div id="roasnote"></div>
    <hr class="rule">
    <div id="camps"></div>
    <div class="spent">spent <b id="spend">₹0</b> · Meta says <b id="mroas">-</b></div>
    <div id="chips"></div>
  </div>

  <svg id="meadow" viewBox="0 0 1920 300" preserveAspectRatio="none"></svg>
  <div class="caption" id="caption"></div>

  <div id="toast"><div id="tbig">🌸</div><div id="th">a new order</div><span id="tamt"></span><div id="tp"></div></div>
  <div id="milestone"><div><p>look at that,</p><h2 id="mh">₹25,000</h2><p>crossed today</p></div></div>
</div>
<canvas id="confetti"></canvas>
<div id="unlock"><div>click once to let the garden sing<small>Browsers need one click before they can play sound. The TV app doesn't.</small></div></div>
<script>
window.DESIGN = "garden";
window.BOARD_COPY = { toastEmoji: ["", "🌼", "🌷", "🌻", "💐"], toastTitle: ["", "a new order", "a lovely order", "a big order!", "what an order!"] };
window.CONFETTI = ["#d9798a", "#f2b8c6", "#d9a441", "#fff3d6", "#8a6a9c"];
window.CAMP_LIMIT = 3;
const PAL = ["#d9798a", "#d9a441", "#8a6a9c", "#c4673f", "#7fa3c2", "#e8a0b4", "#f0c75e"];
window.renderCampaign = (c, be) => {
  const r = c.roas || 0, col = r >= be ? "#6f8f6a" : r >= be * .75 ? "#d9a441" : "#c4673f";
  return `<div class="cp"><i style="background:${col}"></i><span class="n">${esc(c.short)}</span><span class="v" style="color:${col}">${c.roas ? c.roas.toFixed(1) + "x" : "not yet"}</span></div>`;
};
window.renderChip = o => `${o.at} · <b>${esc(o.city || "somewhere")}</b> picked up ${esc(itemsText(o))}, ₹${inr(o.amount)}`;

// deterministic "random" so the same flower always grows in the same spot
const rnd = n => { const x = Math.sin(n * 9301 + 49297) * 233280; return x - Math.floor(x); };
function flower(i) {
  const x = 40 + rnd(i) * 1840, h = 70 + rnd(i + 7) * 120, col = PAL[Math.floor(rnd(i + 3) * PAL.length)];
  const lean = (rnd(i + 11) - .5) * 40, top = 300 - 40 - h, petals = 5 + Math.floor(rnd(i + 5) * 3), r = 13 + rnd(i + 2) * 9;
  let head = "";
  for (let p = 0; p < petals; p++) {
    const a = p / petals * Math.PI * 2;
    head += `<ellipse cx="${(Math.cos(a) * r).toFixed(1)}" cy="${(Math.sin(a) * r).toFixed(1)}" rx="${r * .75}" ry="${r * .5}" transform="rotate(${a * 57.3} ${(Math.cos(a) * r).toFixed(1)} ${(Math.sin(a) * r).toFixed(1)})" fill="${col}" opacity=".82"/>`;
  }
  head += `<circle r="${r * .45}" fill="#f6d36b"/><circle r="${r * .2}" fill="#9b6a2a" opacity=".6"/>`;
  return `<g class="fl" data-i="${i}">
    <path d="M${x} 270 Q ${x + lean} ${top + h * .5} ${x + lean * 1.4} ${top}" stroke="#5f7d55" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <path d="M${x + lean * .3} ${top + h * .6} q 24 -10 30 -30 q -22 4 -30 30z" fill="#7d9b6c" opacity=".85"/>
    <g transform="translate(${x + lean * 1.4} ${top})"><g class="head">${head}</g></g></g>`;
}
let grown = -1;
document.addEventListener("board:state", e => {
  const s = e.detail, g = id => document.getElementById(id);
  const vs = s.vs_yesterday_pct;
  g("prose").innerHTML = `${s.orders} ${s.orders === 1 ? "order" : "orders"} so far, about <em>₹${inr(s.aov)}</em> each.` +
    (vs !== null && vs !== undefined ? ` We're <span class="${vs >= 0 ? "up" : "down"}">${Math.abs(vs)}% ${vs >= 0 ? "ahead of" : "behind"}</span> where we were yesterday at this hour.` : "") +
    (s.new_customers ? ` ${s.new_customers} of them are new faces.` : "");
  if (s.spend) {
    const r = s.roas_real;
    g("roasline").innerHTML = `for every ₹1 we spent, <em>₹${r.toFixed(2)}</em> came back.`;
  } else g("roasline").textContent = "no ads have run yet today.";
  // the meadow: ground first, then one flower per order
  const m = g("meadow"), n = Math.min(s.orders, 140);
  if (grown === -1 || n !== grown) {
    let fl = "";
    for (let i = 0; i < n; i++) fl += flower(i);
    m.innerHTML = `<defs><filter id="soft"><feTurbulence baseFrequency=".02" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="14"/></filter></defs>
      <path d="M0 230 C 300 190, 620 250, 960 215 S 1600 185, 1920 225 L1920 300 L0 300 Z" fill="#a9c093" opacity=".75" filter="url(#soft)"/>
      <path d="M0 255 C 400 225, 800 280, 1200 245 S 1700 240, 1920 255 L1920 300 L0 300 Z" fill="#7f9c6c" opacity=".8" filter="url(#soft)"/>` + fl;
    m.querySelectorAll(".fl").forEach(f => { if (grown >= 0 && +f.dataset.i >= grown) f.classList.add("grow"); });
    grown = n;
  }
  g("caption").textContent = s.orders ? `one flower for every order today · ${s.orders} so far` : "the first flower is coming";
});
</script>
<script src="/board.js?v=1"></script>
</body>
</html>
